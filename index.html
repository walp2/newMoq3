<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WalP (WaleedPro)</title>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <div class="bg-overlay"></div>

  <!-- 🌐 زر تغيير اللغة في الأعلى -->
  <div class="lang-switch-container">
    <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">
      <i class="fa-solid fa-globe"></i> <span id="langBtnText">English</span>
    </button>
  </div>

  <main class="card-container">
    <div class="card">
      
      <div class="avatar-wrapper">
        <img src="assets/avatar.jpg" alt="WalP" class="avatar-img" />
        <div class="online-status"></div>
      </div>

      <div class="name-box">
        <h1 class="main-name" id="mainName" data-hover="Waleed Pro">
          <span class="name-text">WalP</span>
        </h1>
        <p class="sub-handle">@walp.pro</p>
      </div>

      <p class="bio" data-i18n="bio">لاعب ومطور • مؤسس شبكة WalP</p>

      <div class="quick-links">
        <a href="https://discord.gg" target="_blank" class="link-btn">
          <i class="fa-brands fa-discord"></i>
          <span>Discord</span>
        </a>
        <a href="https://github.com" target="_blank" class="link-btn">
          <i class="fa-brands fa-github"></i>
          <span>GitHub</span>
        </a>
      </div>

      <div class="services-grid">
        <a href="http://mc.walp.pro" class="service-card">
          <i class="fa-solid fa-cube"></i>
          <div>
            <strong data-i18n="mcTitle">ماينكرافت</strong>
            <small>mc.walp.pro</small>
          </div>
        </a>
        <a href="http://dl.walp.pro" class="service-card">
          <i class="fa-solid fa-folder-open"></i>
          <div>
            <strong data-i18n="dlTitle">التحميلات</strong>
            <small>dl.walp.pro</small>
          </div>
        </a>
      </div>

      <div class="contact-section">
        <a href="/contact" class="contact-btn">
          <i class="fa-solid fa-paper-plane"></i>
          <span data-i18n="contactBtn">تواصل معي</span>
        </a>
      </div>

    </div>
  </main>

  <div class="athkar-bar" id="athkarBar">
    <div class="athkar-icon"><i class="fa-solid fa-kaaba"></i></div>
    <div class="athkar-content">
      <span id="athkarText">سبحان الله وبحمده، سبحان الله العظيم</span>
    </div>
    <div class="athkar-controls">
      <button onclick="nextThikr()"><i class="fa-solid fa-rotate-right"></i></button>
      <button onclick="toggleAthkar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
